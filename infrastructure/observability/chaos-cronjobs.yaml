          restartPolicy: OnFailure

---
# ServiceAccount for cronjobs to have kubectl permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-controller
  namespace: cosmic-coffee

---
# ClusterRole for cronjobs to manage deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-controller
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/rollout"]
  verbs: ["create"]

---
# ClusterRoleBinding for chaos-controller
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-controller
subjects:
- kind: ServiceAccount
  name: chaos-controller
  namespace: cosmic-coffee
