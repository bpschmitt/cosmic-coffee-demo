apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-orders
  namespace: cosmic-coffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-orders
  template:
    metadata:
      labels:
        app: coffee-orders
    spec:
      containers:
      - name: coffee-orders
        image: bpschmitt/cosmic-coffee-orders:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "cosmic_coffee"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: PRODUCTS_SERVICE_URL
          value: "http://coffee-products:4001"
        - name: FULFILLMENT_SERVICE_URL
          value: "http://coffee-fulfillment:5000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-orders
  namespace: cosmic-coffee
spec:
  type: ClusterIP
  selector:
    app: coffee-orders
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP

