apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-products
  namespace: cosmic-coffee
  labels:
    app.kubernetes.io/name: products
    app.kubernetes.io/instance: coffee-products
    app.kubernetes.io/version: v1.0.0
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cosmic-coffee
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-products
  template:
    metadata:
      labels:
        app: coffee-products
        app.kubernetes.io/name: products
        app.kubernetes.io/instance: coffee-products
        app.kubernetes.io/version: v1.0.0
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: cosmic-coffee
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: coffee-products
        image: bpschmitt/cosmic-coffee-products:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "cosmic_coffee"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-products
  namespace: cosmic-coffee
spec:
  type: ClusterIP
  selector:
    app: coffee-products
  ports:
  - port: 4001
    targetPort: 4001
    protocol: TCP
