apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-fulfillment
  namespace: cosmic-coffee
  labels:
    app.kubernetes.io/name: fulfillment
    app.kubernetes.io/instance: coffee-fulfillment
    app.kubernetes.io/version: v1.0.0
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cosmic-coffee
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-fulfillment
  template:
    metadata:
      labels:
        app: coffee-fulfillment
        app.kubernetes.io/name: fulfillment
        app.kubernetes.io/instance: coffee-fulfillment
        app.kubernetes.io/version: v1.0.0
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: cosmic-coffee
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: coffee-fulfillment
        image: bpschmitt/cosmic-coffee-fulfillment:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "cosmic_coffee"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-fulfillment
  namespace: cosmic-coffee
spec:
  type: ClusterIP
  selector:
    app: coffee-fulfillment
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
