apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-frontend
  namespace: cosmic-coffee
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: coffee-frontend
    app.kubernetes.io/version: v1.1.0
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cosmic-coffee
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-frontend
  template:
    metadata:
      labels:
        app: coffee-frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: coffee-frontend
        app.kubernetes.io/version: v1.1.0
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cosmic-coffee
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: coffee-frontend
        image: bpschmitt/cosmic-coffee-frontend:v1.1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: ""
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-frontend
  namespace: cosmic-coffee
spec:
  type: ClusterIP
  selector:
    app: coffee-frontend
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
