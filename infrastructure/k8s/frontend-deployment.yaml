apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-frontend
  namespace: cosmic-coffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-frontend
  template:
    metadata:
      labels:
        app: coffee-frontend
    spec:
      containers:
      - name: coffee-frontend
        image: bpschmitt/cosmic-coffee-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: ""
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-frontend
  namespace: cosmic-coffee
spec:
  type: ClusterIP
  selector:
    app: coffee-frontend
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP

